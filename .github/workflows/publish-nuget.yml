name: Publish NuGet Package

on:
  release:
    types: [published]
    
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with: 
          dotnet-version: '10.0.x'
          
      - name: Dotnet Restore
        run: dotnet restore
        
      - name: Dotnet Build
        run: dotnet build --configuration Release --no-restore
        
      - name: Dotnet Pack
        run: |
          VERSION=${{ github.event.release.tag_name }}
          VERSION=${VERSION#v}
          dotnet pack --configuration Release --no-build --no-build -p:PackageVersion=$VERSION --output ./dist
          
      - name: Authenticate with NuGet
        uses: NuGet/login@v1
        id: login
        with:
          user: MillzyDev
          
      - name: Dotnet NuGet Push
        run: dotnet nuget push "./dist/*.nupkg" --api-key ${{steps.login.outputs.NUGET_API_KEY}} --source https://api.nuget.org/v3/index.json --skip-duplicate