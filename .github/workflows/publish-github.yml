name: Publish GitHub Package

on:
  release:
    types: [published]
    
  workflow_dispatch: 
    version:
      required: true
      type: string
        
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      packages: write
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Dotnet Restore
        run: dotnet restore

      - name: Dotnet Build
        run: dotnet build --configuration Release --no-restore

      - name: Dotnet Pack
  
        run: |
          VERSION=${{ github.event.release.tag_name || inputs.version }}
          VERSION=${VERSION#v}
          dotnet pack --configuration Release --no-build --no-build -p:PackageVersion=$VERSION --output ./dist

      - name: Publish to GitHub Packages
        run: dotnet nuget push "./dist/*.nupkg" --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" --api-key "${{ secrets.GITHUB_TOKEN }}"
        
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with: 
          files: ./dist/*.nupkg
        env: 
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}